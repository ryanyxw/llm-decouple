ROOT_DIR: .
DATA_DIR: /mnt/nfs1/ryan/decouple/data
MODEL_DIR: ${ROOT_DIR}/models
OLMO_DIR: ${ROOT_DIR}/OLMo

num_proc: 8
master_seed: 0

#choose from "olmo_standard" vs "olmo_custom".
model_type: "olmo_standard"

master_batch_size: 32
master_generation_kwargs:
  max_new_tokens: 50
  do_sample: True
  top_k: 50

model_paths:
  - ${MODEL_DIR}/checkpoints/step738000-hf # control (Olmo 1B) needs to be downloaded by download_olmo_ckpt.sh
  - ${MODEL_DIR}/figure2/low-risk_partition0/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/low-risk_partition1/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/low-risk_partition2/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/toxic-baseline_partition0/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/toxic-baseline_partition1/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/toxic-baseline_partition2/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/masked-slung_partition0/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/masked-slung_partition1/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/masked-slung_partition2/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/unlikelihood-slung_partition0/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/unlikelihood-slung_partition1/step1020-unsharded/hf
  - ${MODEL_DIR}/figure2/unlikelihood-slung_partition2/step1020-unsharded/hf

  - ${MODEL_DIR}/checkpoints/step738000-hf/instruction_tuned
  - ${MODEL_DIR}/figure2/low-risk_partition0/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/low-risk_partition1/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/low-risk_partition2/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/toxic-baseline_partition0/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/toxic-baseline_partition1/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/toxic-baseline_partition2/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/masked-slung_partition0/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/masked-slung_partition1/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/masked-slung_partition2/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/unlikelihood-slung_partition0/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/unlikelihood-slung_partition1/step1020-unsharded/instruction_tuned
  - ${MODEL_DIR}/figure2/unlikelihood-slung_partition2/step1020-unsharded/instruction_tuned



#each evaluator must have: label, data
evaluators:
  # this performs realtoxicityprompts generation
  - label: "realtoxicityprompts_generation"
    data:
      name: "allenai/real-toxicity-prompts"
      num_examples: 2000
    seed: ${master_seed}
    batch_size: ${master_batch_size}
    generation_kwargs: ${master_generation_kwargs}

  # this performs civilcomment classification of toxic vs nontoxic
  # for custom models, choose from raw, add double, or add doublediff
  - label: "NEW_civilcomments_hiddenstate"
    data:
      name: "google/civil_comments"
      toxicity_threshold: 0.5
      num_train: 8000
      num_test: 2000
      num_samples: 3
    use_prompt: False
    seed: ${master_seed}
    batch_size: ${master_batch_size}

